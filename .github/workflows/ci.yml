name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} · ${{ matrix.deps }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            deps: 'lowest'
          - php: '8.3'
            deps: 'highest'
          - php: '8.4'
            deps: 'highest'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, json, openssl, pdo, pdo_sqlite
        coverage: none

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-

    - name: Install dependencies
      run: |
        if [ "${{ matrix.deps }}" = "lowest" ]; then
          composer update --prefer-lowest --prefer-stable --no-progress --no-interaction
        else
          composer update --prefer-stable --no-progress --no-interaction
        fi

    - name: Validate composer.json
      run: composer validate --strict

    - name: Audit dependencies
      run: composer audit

    - name: Run PHPUnit (unit + integration)
      run: vendor/bin/phpunit

    - name: Run PHPStan (Level 9)
      run: vendor/bin/phpstan analyse --no-progress

    - name: Run PHPCS (PSR-12)
      run: vendor/bin/phpcs --standard=phpcs.xml

  databases:
    runs-on: ubuntu-latest
    name: Databases (MySQL + PostgreSQL)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pivot
          MYSQL_USER: pivot
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pivot
          POSTGRES_USER: pivot
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pivot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, json, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
        coverage: none

    - name: Install dependencies
      run: composer update --prefer-stable --no-progress --no-interaction

    - name: Run database tests
      env:
        DB_MYSQL_HOST: 127.0.0.1
        DB_PGSQL_HOST: 127.0.0.1
        DB_DATABASE: pivot
        DB_USERNAME: pivot
        DB_PASSWORD: secret
      run: vendor/bin/phpunit tests/Database
